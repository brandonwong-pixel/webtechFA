<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements - Quest Housing Sales</title>
    <link rel="stylesheet" href="style.css">
    <script>

        if (sessionStorage.getItem('quest_logged_in') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="header">
    <div class="container">
        <a href="index.html" class="logo">🏠 Quest Housing Sales</a>
        <nav class="nav">
            <a href="index.html">🏠 Home</a>
            <a href="units.html">🏢 Units</a>
            <a href="buyers.html">👥 Buyers</a>
            <a href="announcements.html" class="active">📢 Announcements</a>
            <a href="about.html">ℹ️ About</a>
            <a href="login.html" onclick="logout()" class="logout">🚪 Logout</a>
        </nav>
    </div>
</header>

<main class="main" id="main">
    <div class="container">

        <h2 class="page-title">📢 Announcements</h2>

        <div class="form-card">
            <h3>➕ Add New Announcement</h3>
            <div class="form-row">
                <div class="form-group" style="flex:4;">
                    <input type="text" id="announceText" placeholder="e.g. New phase release - Riverbend">
                </div>
                <div class="form-group" style="flex:0 0 auto;">
                    <button class="btn btn-success" id="addBtn">➕ Add</button>
                    <button class="btn btn-warning" id="cancelBtn" style="display:none;">✖ Cancel</button>
                </div>
            </div>
            <input type="hidden" id="editId">
        </div>

        <div id="list">
            <span class="empty">Loading...</span>
        </div>

    </div>
</main>

<footer class="footer">
    <div class="container">
        <p>© 2026 <strong>Quest Housing Sales</strong></p>
    </div>
</footer>

<script>
    function escapeHtml(value) {
        const safeText = document.createElement('span');
        safeText.textContent = value == null ? '' : String(value);
        return safeText.innerHTML;
    }
    function logout() {
        sessionStorage.removeItem('quest_logged_in');
        sessionStorage.removeItem('quest_user');
    }

    const getData = async (url) => (await fetch(url)).json();
    const postData = async (url, data) => (await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })).json();
    const putData = async (url, data) => (await fetch(url, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })).json();
    const deleteData = async (url) => (await fetch(url, { method: 'DELETE' })).json();

    let announcements = [];

    function show() {
        const list = document.getElementById('list');
        if (announcements.length === 0) {
            list.innerHTML = '<span class="empty">No announcements yet. Add your first one above.</span>';
            return;
        }
        let html = '';
        for (let i = 0; i < announcements.length; i++) {
            const a = announcements[i];
            html += `<div class="announcement-item">
                <span>📢 ${escapeHtml(a.text)}</span>
                <div>
                    <span class="edit-btn" onclick="editAnnouncement(${a.id})">✏️ Edit</span>
                    <span class="delete-btn" onclick="deleteAnnouncement(${a.id})">🗑️ Delete</span>
                </div>
            </div>`;
        }
        list.innerHTML = html;
    }

    async function load() {
        announcements = await getData('/api/announcements');
        show();
    }

    document.getElementById('addBtn').addEventListener('click', async () => {
        const text = document.getElementById('announceText').value.trim();
        if (!text) return alert('Please enter announcement text');

        const editId = parseInt(document.getElementById('editId').value);
        if (editId) {
            await putData('/api/announcements/' + editId, { text });
        } else {
            await postData('/api/announcements', { text });
        }
        cancelEdit();
        load();
    });

    function editAnnouncement(id) {
        const a = announcements.find(x => x.id === id);
        if (!a) return;
        document.getElementById('announceText').value = a.text;
        document.getElementById('editId').value = id;
        document.getElementById('addBtn').textContent = '💾 Update';
        document.getElementById('cancelBtn').style.display = 'inline-block';
    }

    function cancelEdit() {
        document.getElementById('announceText').value = '';
        document.getElementById('editId').value = '';
        document.getElementById('addBtn').textContent = '➕ Add';
        document.getElementById('cancelBtn').style.display = 'none';
    }
    document.getElementById('cancelBtn').addEventListener('click', cancelEdit);

    async function deleteAnnouncement(id) {
        const a = announcements.find(x => x.id === id);
        if (!confirm('Delete "' + a.text + '"?')) return;
        await deleteData('/api/announcements/' + id);
        load();
    }

    load();
</script>

</body>
</html>
