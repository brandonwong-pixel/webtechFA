<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Units - Quest Housing Sales</title>
    <link rel="stylesheet" href="style.css">
    <script>

        if (sessionStorage.getItem('quest_logged_in') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="header">
    <div class="container">
        <a href="index.html" class="logo"> Quest Housing Sales</a>
        <nav class="nav">
            <a href="index.html"> Home</a>
            <a href="units.html" class="active"> Units</a>
            <a href="buyers.html"> Buyers</a>
            <a href="announcements.html"> Announcements</a>
            <a href="about.html"> About</a>
            <a href="login.html" onclick="logout()" class="logout"> Logout</a>
        </nav>
    </div>
</header>

<main class="main" id="main">
    <div class="container">

        <h2 class="page-title"> Property Units</h2>

        <div class="form-card">
            <h3> Add New Unit</h3>
            <form id="unitForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Unit Name</label>
                        <input type="text" id="unitName" placeholder="e.g. Maple 301" required>
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <select id="unitType">
                            <option value="Condo">Condo</option>
                            <option value="Landed House">Landed House</option>
                            <option value="Terrace House">Terrace House</option>
                            <option value="Townhouse">Townhouse</option>
                            <option value="Semi-Detached">Semi-Detached</option>
                            <option value="Bungalow">Bungalow</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="unitLocation" placeholder="e.g. Northgate">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="unitStatus">
                            <option value="Available">Available</option>
                            <option value="Sold">Sold</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Price ($)</label>
                        <input type="number" id="unitPrice" placeholder="450000" min="0">
                    </div>
                    <div class="form-group">
                        <label>Property Image</label>
                        <input type="file" id="unitImage" accept="image/*">
                        <button type="button" class="btn btn-warning" id="removeImageBtn" style="display:none; margin-top: 8px; padding: 6px 14px; font-size: 12px; min-height: auto;"> Remove Image</button>
                    </div>
                    <div class="form-group" style="flex:0 0 auto;">
                        <button type="submit" class="btn btn-success" id="submitBtn"> Add</button>
                        <button type="button" class="btn btn-warning" id="cancelBtn" style="display:none;"> Cancel</button>
                    </div>
                </div>
                <input type="hidden" id="editId">
                <input type="hidden" id="unitImageData" value="">
                <div id="imagePreview" style="margin-top: 15px;"></div>
            </form>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr><th>Unit</th><th>Type</th><th>Location</th><th>Status</th><th>Price</th><th>Actions</th></tr>
                </thead>
                <tbody id="unitTable">
                    <tr><td colspan="6" class="empty">Loading units...</td></tr>
                </tbody>
            </table>
        </div>

    </div>
</main>

<footer class="footer">
    <div class="container">
        <p> 2026 <strong>Quest Housing Sales</strong></p>
    </div>
</footer>

<script>
    function escapeHtml(value) {
        const safeText = document.createElement('span');
        safeText.textContent = value == null ? '' : String(value);
        return safeText.innerHTML;
    }
    function logout() {
        sessionStorage.removeItem('quest_logged_in');
        sessionStorage.removeItem('quest_user');
    }

    async function readResponse(response) {
        const result = await response.json();
        if (!response.ok) {
            throw new Error(result.error || 'The request could not be completed.');
        }
        return result;
    }

    const getData = async (url) => readResponse(await fetch(url));
    const postData = async (url, data) => readResponse(await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }));
    const putData = async (url, data) => readResponse(await fetch(url, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }));
    const deleteData = async (url) => readResponse(await fetch(url, { method: 'DELETE' }));

    let units = [];

    /* ----- IMAGE UPLOAD ----- */
    const fileInput = document.getElementById('unitImage');
    const imagePreview = document.getElementById('imagePreview');
    const imageDataInput = document.getElementById('unitImageData');
    const removeImageBtn = document.getElementById('removeImageBtn');

    fileInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        imagePreview.innerHTML = '';
        const imageObjectURL = URL.createObjectURL(file);
        const newImg = document.createElement('img');
        newImg.src = imageObjectURL;
        newImg.alt = "Unit preview";
        newImg.style.maxWidth = '200px';
        newImg.style.border = '2px solid #ddd';
        newImg.style.borderRadius = '4px';
        newImg.style.padding = '5px';
        imagePreview.appendChild(newImg);

        const reader = new FileReader();
        reader.onload = function(e) {
            imageDataInput.value = e.target.result;
        };
        reader.readAsDataURL(file);

        removeImageBtn.style.display = 'inline-block';
    });

    removeImageBtn.addEventListener('click', function() {
        fileInput.value = '';
        imageDataInput.value = '';
        imagePreview.innerHTML = '';
        removeImageBtn.style.display = 'none';
    });

    /* ----- DISPLAY UNITS ----- */
    function showUnits() {
        const table = document.getElementById('unitTable');
        if (units.length === 0) {
            table.innerHTML = '<tr><td colspan="6" class="empty">No units yet. Add your first unit above.</td></tr>';
            return;
        }
        let html = '';
        for (let i = 0; i < units.length; i++) {
            const u = units[i];
            const image = u.image_data || '';
            
            html += `<tr>
                <td>
                    <span class="unit-name" onclick="toggleImage(${u.id})">
                        ${escapeHtml(u.name)}
                    </span>
                </td>
                <td>${escapeHtml(u.type)}</td>
                <td>${escapeHtml(u.location)}</td>
                <td><span class="badge badge-${u.status.toLowerCase()}">${escapeHtml(u.status)}</span></td>
                <td>$${Number(u.price).toLocaleString()}</td>
                <td>
                    <span class="edit-btn" onclick="editUnit(${u.id})"> Edit</span>
                    <span class="delete-btn" onclick="deleteUnitHandler(${u.id})"> Delete</span>
                </td>
            </tr>`;
            
            if (image) {
                html += `<tr class="unit-image-row" id="imageRow-${u.id}">
                    <td colspan="6">
                        <img src="${escapeHtml(image)}" alt="${escapeHtml(u.name)}">
                        <div class="preview-label">
                            <strong>${escapeHtml(u.name)}</strong> — ${escapeHtml(u.type)}<br>
                             ${escapeHtml(u.location)} &nbsp;|&nbsp;  $${Number(u.price).toLocaleString()} &nbsp;|&nbsp; <span class="badge badge-${u.status.toLowerCase()}">${escapeHtml(u.status)}</span>
                        </div>
                    </td>
                </tr>`;
            }
        }
        table.innerHTML = html;
    }

    function toggleImage(id) {
        document.querySelectorAll('.unit-image-row.open').forEach(row => {
            if (row.id !== 'imageRow-' + id) {
                row.classList.remove('open');
            }
        });
        
        const row = document.getElementById('imageRow-' + id);
        if (!row) return;
        row.classList.toggle('open');
    }

    async function loadUnits() {
        units = await getData('/api/units');
        showUnits();
    }

    document.getElementById('unitForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            name: document.getElementById('unitName').value.trim(),
            type: document.getElementById('unitType').value,
            location: document.getElementById('unitLocation').value.trim(),
            status: document.getElementById('unitStatus').value,
            price: parseFloat(document.getElementById('unitPrice').value) || 0,
            image_data: imageDataInput.value || ''
        };
        if (!data.name) return alert('Please enter a unit name');
        if (!data.location) return alert('Please enter a location');
        if (data.price <= 0) return alert('Please enter a valid price');

        const editId = parseInt(document.getElementById('editId').value);
        try {
            if (editId) {
                await putData('/api/units/' + editId, data);
            } else {
                await postData('/api/units', data);
            }
        } catch (error) {
            alert(error.message || 'Could not save the property. Please try again.');
            return;
        }

        e.target.reset();
        document.getElementById('unitStatus').value = 'Available';
        cancelEdit();
        try {
            await loadUnits();
        } catch (error) {
            alert('The property was saved, but the list could not refresh. Reload the page to see it.');
        }
    });

    function editUnit(id) {
        const u = units.find(x => x.id === id);
        if (!u) return;
        document.getElementById('unitName').value = u.name;
        document.getElementById('unitType').value = u.type;
        document.getElementById('unitLocation').value = u.location;
        document.getElementById('unitStatus').value = u.status;
        document.getElementById('unitPrice').value = u.price;
        document.getElementById('editId').value = id;
        document.getElementById('submitBtn').textContent = ' Update';
        document.getElementById('cancelBtn').style.display = 'inline-block';

        const imageData = u.image_data || '';
        imageDataInput.value = imageData;
        imagePreview.innerHTML = '';
        if (imageData) {
            const img = document.createElement('img');
            img.src = imageData;
            img.alt = u.name;
            img.style.maxWidth = '200px';
            img.style.border = '2px solid #ddd';
            img.style.borderRadius = '4px';
            img.style.padding = '5px';
            imagePreview.appendChild(img);
            removeImageBtn.style.display = 'inline-block';
        } else {
            removeImageBtn.style.display = 'none';
        }
    }

    function cancelEdit() {
        document.getElementById('editId').value = '';
        document.getElementById('submitBtn').textContent = ' Add';
        document.getElementById('cancelBtn').style.display = 'none';
        imageDataInput.value = '';
        imagePreview.innerHTML = '';
        fileInput.value = '';
        removeImageBtn.style.display = 'none';
    }
    document.getElementById('cancelBtn').addEventListener('click', cancelEdit);

    async function deleteUnitHandler(id) {
        const u = units.find(x => x.id === id);
        if (!confirm('Delete "' + u.name + '"?')) return;
        await deleteData('/api/units/' + id);
        loadUnits();
    }

    loadUnits();
</script>

</body>
</html>
